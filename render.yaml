services:
  - type: web
    name: codesage-review-agent
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: HOST
        value: "0.0.0.0"
      - key: EXECUTION_PROVIDER
        value: "local"
      - key: EXECUTION_TIMEOUT_SECONDS
        value: "8"
      - key: EXECUTION_MEMORY_MB
        value: "128"
